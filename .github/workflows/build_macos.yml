# Build from source on Mac OS.
name: build_macos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: macos-15
          compiler: 'clang'
          configure_options: ''
        - os: macos-26
          compiler: 'clang'
          configure_options: ''
        - os: macos-26
          compiler: 'gcc'
          configure_options: ''
        - os: macos-26-intel
          compiler: 'clang'
          configure_options: ''
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install build dependencies
      run: |
        brew update -q
        brew install -q autoconf automake gettext gnu-sed libtool pkg-config || true
        ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize
    - name: Download test data
      run: |
        if test -x "synctestdata.sh"; then ./synctestdata.sh; fi
    - name: Build from source
      env:
        CC: ${{ matrix.compiler }}
      run: |
        ./synclibs.sh --use-head
        ./autogen.sh
        ./configure ${{ matrix.configure_options }}
        make -j4 > /dev/null
    - name: Run tests
      run: |
        tests/runtests.sh -j4 VERBOSE=1
  build_macfuse:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: macos-15
          compiler: 'clang'
          configure_options: ''
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install build dependencies
      run: |
        brew update -q
        brew install -q autoconf automake gettext gnu-sed libtool pkg-config || true
        ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize
    - name: Install macFUSE
      run: brew install --cask macfuse
    - name: Download test data
      run: |
        if test -x "synctestdata.sh"; then ./synctestdata.sh; fi
    - name: Build from source
      env:
        CC: ${{ matrix.compiler }}
      run: |
        ./synclibs.sh --use-head
        ./autogen.sh
        ./configure ${{ matrix.configure_options }}
        make -j4 > /dev/null
    - name: Run tests
      run: |
        tests/runtests.sh -j4 VERBOSE=1
  build_python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: macos-26
          compiler: 'gcc'
          configure_options: '--enable-python'
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install build dependencies
      run: |
        brew update -q
        brew install -q autoconf automake gettext gnu-sed libtool pkg-config || true
        ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize
    - name: Download test data
      run: |
        if test -x "synctestdata.sh"; then ./synctestdata.sh; fi
    - name: Build from source
      env:
        CC: ${{ matrix.compiler }}
      run: |
        ./synclibs.sh --use-head
        ./autogen.sh
        ./configure ${{ matrix.configure_options }} PYTHON="$(brew --prefix python3)/bin/python3"
        make -j4 > /dev/null
    - name: Run tests
      run: |
        tests/runtests.sh -j4 PYTHON="$(brew --prefix python3)/bin/python3" VERBOSE=1
